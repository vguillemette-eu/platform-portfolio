name: Web App

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: tcp://forgejo-runner.forgejo.svc.cluster.local:2375

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Forgejo Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ forgejo.server_url }}
          username: ${{ forgejo.actor }}
          password: ${{ forgejo.token }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ forgejo.server_url }}/${{ forgejo.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push OCI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to K3s OVHcloud Cluster
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Setup Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_OVH }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to K3s OVHcloud Cluster
        run: |
          # Application des manifestes Kubernetes
          kubectl apply -f k8s/
          
          # Mise à jour de l'image sur le deployment
          kubectl set image deployment/nuxt-web nuxt-app=${{ forgejo.server_url }}/${{ forgejo.repository }}:${{ steps.meta.outputs.version }} -n default
          
          # Attente de la validation du déploiement
          kubectl rollout status deployment/nuxt-web -n default --timeout=120s
